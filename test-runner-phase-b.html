<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Phase B Diagnostic Runner</title>
</head>
<body>
    <div id="results">Running Phase B Tests...</div>
    <script src="i18n.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', (e) => {
            // Prevent auto-redirects from admin or auth guards during test
            e.stopImmediatePropagation();
        }, true);
    </script>
    <script src="app.js"></script>
    <script src="checkout.js"></script>
    <script>
        try {
            const results = [];
            const assert = (condition, name) => {
                if (!condition) {
                    throw new Error('Test Failed: ' + name);
                }
                results.push('PASS: ' + name);
            };

            // Test 1: i18n translateText behavior
            localStorage.setItem('koko_lang', 'en');
            localStorage.setItem('luxe_lang', 'en');
            if (window.i18n && window.i18n.setLanguage) window.i18n.setLanguage('en');
            const enTrans = window.i18n.translateText('Serum');
            assert(enTrans === 'Serum', 'i18n does not force Arabic when lang is en (' + enTrans + ')');
            
            const forceArTrans = window.i18n.translateText('Serum', true);
            assert(forceArTrans === 'سيروم', 'i18n translates to Arabic with forceAr=true (' + forceArTrans + ')');

            if (window.i18n && window.i18n.setLanguage) window.i18n.setLanguage('ar');
            const arTrans = window.i18n.translateText('Serum');
            assert(arTrans === 'سيروم', 'i18n translates to Arabic when lang is ar (' + arTrans + ')');

            // Test 2: isAdmin() checks user.role === 'admin'
            localStorage.setItem('currentUser', JSON.stringify({ role: 'admin' }));
            assert(typeof isAdmin === 'function' && isAdmin() === true, 'isAdmin recognizes role: admin');
            localStorage.setItem('currentUser', JSON.stringify({ isAdmin: true }));
            assert(isAdmin() === true, 'isAdmin recognizes isAdmin: true');
            localStorage.setItem('currentUser', JSON.stringify({ email: 'aemade2016@gmail.com' }));
            assert(isAdmin() === true, 'isAdmin recognizes superadmin email');
            localStorage.setItem('currentUser', JSON.stringify({ role: 'customer' }));
            assert(isAdmin() === false, 'isAdmin rejects customer role');

            // Test 3: showToast dynamic creation and class sanitization
            const oldToast = document.getElementById('toast');
            if (oldToast) oldToast.remove();

            window.showToast('Test Error Notice', 'error');
            const createdToast = document.getElementById('toast');
            assert(createdToast !== null, 'showToast dynamically creates #toast when absent');
            assert(createdToast.classList.contains('bg-rose-500'), 'Error toast has bg-rose-500');
            assert(createdToast.classList.contains('text-white'), 'Error toast has text-white');
            assert(!createdToast.classList.contains('bg-white'), 'Error toast stripped bg-white');

            window.showToast('Test Success Notice', 'success');
            assert(createdToast.classList.contains('bg-emerald-500'), 'Success toast has bg-emerald-500');
            assert(!createdToast.classList.contains('bg-rose-500'), 'Success toast removed bg-rose-500');

            // Test 4: safeUrl validation
            assert(safeUrl('javascript:alert(1)', './images/slider-1.jpeg') === './images/slider-1.jpeg', 'safeUrl rejects javascript:');
            assert(safeUrl('data:text/html;base64,PHNjcmlwdD4=', './images/slider-1.jpeg') === './images/slider-1.jpeg', 'safeUrl rejects data:text/html');
            assert(safeUrl('https://example.com/photo.jpg') === 'https://example.com/photo.jpg', 'safeUrl allows valid https');
            assert(safeUrl('./images/slider-1.jpeg') === './images/slider-1.jpeg', 'safeUrl allows ./images/ paths');

            // Test 5: safeUrl in checkout.js
            assert(window.safeUrl('javascript:alert(1)', 'fallback') === 'fallback', 'checkout.js safeUrl blocks javascript:');

            document.getElementById('results').textContent = 'ALL_PHASE_B_DIAGNOSTICS_PASSED: ' + results.length + ' tests passed!';
        } catch (err) {
            document.getElementById('results').textContent = 'DIAG_FAIL: ' + err.message;
        }
    </script>
</body>
</html>
